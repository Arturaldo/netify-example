<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Изменить данные</title>
  <link rel="stylesheet" href="../../assets/scss/collect.scss">
  <link rel="stylesheet" href="./index.scss">
</head>
<body>
  <div class="profile">
    <aside class="profile__sidebar">
      <a href="./index.html" class="profile__back-button">←</a>
    </aside>

    <main class="profile__content">
      <div class="profile__avatar-block">
        <div class="profile__avatar">
          {{#if avatar}}
            <img src="{{avatar}}" alt="Аватар пользователя {{display_name}}">
          {{else}}
            <span class="profile__avatar-placeholder"></span>
          {{/if}}
        </div>
      </div>

      <form
        class="profile__info profile__form"
        id="profileForm"
      >
        <label class="profile__row">
          <span class="profile__row-label">Почта</span>
          <input
            class="profile__row-input"
            type="email"
            name="email"
            value="{{email}}"
          >
        </label>

        <label class="profile__row">
          <span class="profile__row-label">Логин</span>
          <input
            class="profile__row-input"
            type="text"
            name="login"
            value="{{login}}"
          >
        </label>

        <label class="profile__row">
          <span class="profile__row-label">Имя</span>
          <input
            class="profile__row-input"
            type="text"
            name="first_name"
            value="{{first_name}}"
          >
        </label>

        <label class="profile__row">
          <span class="profile__row-label">Фамилия</span>
          <input
            class="profile__row-input"
            type="text"
            name="second_name"
            value="{{second_name}}"
          >
        </label>

        <label class="profile__row">
          <span class="profile__row-label">Имя в чате</span>
          <input
            class="profile__row-input"
            type="text"
            name="display_name"
            value="{{display_name}}"
          >
        </label>

        <label class="profile__row">
          <span class="profile__row-label">Телефон</span>
          <input
            class="profile__row-input"
            type="tel"
            name="phone"
            value="{{phone}}"
          >
        </label>
      </form>

      <button class="profile__primary-button" type="submit" form="profileForm">
        Сохранить
      </button>
    </main>
  </div>
</body>
</html>
