<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Изменить пароль</title>
  <link rel="stylesheet" href="../../assets/scss/collect.scss">
  <link rel="stylesheet" href="./index.scss">
</head>
<body>
  <div class="profile">
    <aside class="profile__sidebar">
      <a href="./index.html" class="profile__back-button">←</a>
    </aside>

    <main class="profile__content">
      <div class="profile__avatar-block">
        <div class="profile__avatar">
          <span class="profile__avatar-placeholder"></span>
        </div>
        <div class="profile__name">{{display_name}}</div>
      </div>

      <form
        class="profile__info profile__form"
        id="passwordForm"
      >
        <label class="profile__row">
          <span class="profile__row-label">Старый пароль</span>
          <input
            class="profile__row-input"
            type="password"
            name="oldPassword"
          >
        </label>

        <label class="profile__row">
          <span class="profile__row-label">Новый пароль</span>
          <input
            class="profile__row-input"
            type="password"
            name="newPassword"
          >
        </label>
      </form>

      <button class="profile__primary-button" type="submit" form="passwordForm">
        Сохранить
      </button>
    </main>
  </div>
</body>
</html>
